# Sigma Sync - Apache include for the public.aap.cornell.edu HTTPS vhost.
#   sudo cp deploy/sigmasync.conf /etc/httpd/conf.d/sigmasync.conf   (or Include it in the vhost)
#   sudo httpd -t && sudo systemctl reload httpd
#
# No Shibboleth: the app is open to the internet and signs people in itself by
# verifying a signature from their Ergo wallet (see README.md, "How sign-in works").

Alias /apps/sigmasync /data/AAP_Storage/apps/sigmasync

<Directory /data/AAP_Storage/apps/sigmasync>
    Options -Indexes +ExecCGI -FollowSymLinks
    AllowOverride None
    AddHandler cgi-script .pl
    DirectoryIndex index.html
    Require all granted

    SetEnv APP_ENV_FILE /data/AAP_Storage/secrets/sigmasync.env

    # Only the page, its assets and the API are public. Modules, schema, docs, scripts
    # and dotfiles in the checkout are refused.
    <FilesMatch "(^\.|\.(pm|sql|md|sh|py|t|json|txt|conf|env|example)$)">
        Require all denied
    </FilesMatch>

    Header always set Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.github.com https://api.ergoplatform.com; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    Header always set Permissions-Policy "camera=(self), microphone=(), geolocation=()"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    # Revalidate on every load so a redeploy reaches everyone immediately.
    Header set Cache-Control "no-cache"
</Directory>

<DirectoryMatch "^/data/AAP_Storage/apps/sigmasync/(\.git|deploy|t|tools)(/|$)">
    Require all denied
</DirectoryMatch>

# If mod_shib is active on this vhost, make sure it never demands a session here.
<IfModule mod_shib>
    <Location /apps/sigmasync>
        ShibRequestSetting requireSession false
    </Location>
</IfModule>
